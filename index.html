<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Western Front</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Oswald:wght@500;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header id="hud">
      <div class="brand"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1.5 14.9 8.6 22.5 9.2 16.7 14.2 18.5 21.6 12 17.6 5.5 21.6 7.3 14.2 1.5 9.2 9.1 8.6z"/></svg><span>Western Front</span></div>
      <div class="goal" id="goal"><span class="k">Goal</span><span id="goal-text">Capture a rail hub and hold it</span></div>
      <ol class="timeline" id="timeline" aria-label="Progress through the war"></ol>
      <div class="stats">
        <div class="stat" title="Total soldiers lost so far"><span class="k">Soldiers lost</span><b id="cas">0</b></div>
        <div class="stat" title="If the home front loses heart, the war is lost"><span class="k">Home-front morale</span>
          <span class="meter" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="mor-bar"><i id="mor-fill"></i></span></div>
      </div>
      <div class="tools">
        <button id="btn-zoom" type="button" title="Zoom the map">Zoom</button>
        <button id="btn-sound" type="button" title="Sound effects">Sound off</button>
        <button id="btn-help" type="button" title="How to play">? Help</button>
      </div>
    </header>

    <main id="main">
      <section id="stage">
        <div id="board-wrap"><canvas id="board" tabindex="0" aria-label="Battlefield map. Use arrow keys to move the cursor and Enter to click."></canvas></div>
        <div id="tip" role="tooltip" hidden></div>
        <div id="banner" hidden></div>
      </section>

      <aside id="panel">
        <div id="advisor" class="advisor" aria-live="polite">
          <svg class="avatar" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="27" r="14" fill="#e3b78f"/><path d="M8 25C8 11 17 6 24 6s16 5 16 19z" fill="#5b6b3d"/><rect x="5" y="24" width="38" height="5" rx="2.5" fill="#46542f"/><circle cx="19" cy="31" r="1.8" fill="#222"/><circle cx="29" cy="31" r="1.8" fill="#222"/><path d="M16 37c3-3 13-3 16 0-3 1-5 .5-8 .5s-5 .5-8-.5z" fill="#5a3a22"/></svg>
          <div><span class="who">Sergeant</span><p id="advice"></p></div>
        </div>
        <div id="unitcard" class="card-unit"></div>
        <div id="actions"></div>
        <div id="recruit"></div>
        <button id="endturn" type="button" class="endturn"><span>End Turn</span><small id="idle"></small></button>
        <details id="logbox" open><summary>Battle log</summary><ol id="log" aria-live="polite"></ol></details>
        <button id="newgame" type="button" class="link">Restart game</button>
      </aside>
    </main>
  </div>

  <div id="overlay" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="ov-title">
      <div id="ov-kicker" class="kicker"></div>
      <h2 id="ov-title"></h2>
      <div id="ov-body"></div>
      <div class="sheet-buttons">
        <button id="ov-cancel" type="button" class="btn ghost" hidden></button>
        <button id="ov-btn" type="button" class="btn primary"></button>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/map.js"></script>
  <script src="js/units.js"></script>
  <script src="js/years.js"></script>
  <script src="js/combat.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/render.js"></script>
  <script src="js/coach.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
