<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Western Front</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Unit icons -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-infantry" viewBox="0 0 24 24"><path d="M5 12a7 7 0 0 1 14 0z"/><rect x="3" y="13" width="18" height="2.5" rx="1"/><rect x="10" y="17" width="4" height="5" rx="1"/></symbol>
      <symbol id="i-machinegun" viewBox="0 0 24 24"><rect x="2" y="8" width="14" height="4" rx="1"/><rect x="15" y="6" width="6" height="8" rx="1"/><path d="M7 12l-3 9h2.2l2.3-6.5L10 21h2.2z"/></symbol>
      <symbol id="i-artillery" viewBox="0 0 24 24"><path d="M3 16 15 5l2.2 2.4L5.6 18z"/><circle cx="14" cy="17" r="5" fill="none" stroke="currentColor" stroke-width="2.4"/><circle cx="14" cy="17" r="1.4"/></symbol>
      <symbol id="i-gas" viewBox="0 0 24 24"><path d="M7 18a4 4 0 0 1-.5-7.9A5.5 5.5 0 0 1 17 8.5 4.5 4.5 0 0 1 17.5 18z"/></symbol>
      <symbol id="i-tank" viewBox="0 0 24 24"><rect x="3" y="12" width="18" height="7" rx="3.5"/><rect x="8" y="7" width="8" height="5" rx="1"/><rect x="15" y="8.5" width="7" height="2"/></symbol>
      <symbol id="i-storm" viewBox="0 0 24 24"><path d="M13 2 4 14h6l-2 8 10-13h-6z"/></symbol>
      <symbol id="i-hub" viewBox="0 0 24 24"><path d="M12 2 22 12 12 22 2 12z"/></symbol>
    </defs>
  </svg>

  <header id="topbar">
    <h1>Western Front</h1>
    <div class="stat" id="stat-date"><span class="k">Year</span><span class="v" id="year">1914</span> <span class="k">Turn</span><span class="v" id="turn">1/6</span></div>
    <div class="stat"><span class="k">Casualties</span><span class="v" id="casualties">0</span></div>
    <div class="stat morale"><span class="k">Morale</span>
      <span class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="morale-bar"><span id="morale-fill"></span></span>
      <span class="v" id="morale">100</span></div>
    <div class="stat"><span class="k">Manpower</span><span class="v" id="manpower">0</span></div>
  </header>

  <main id="layout">
    <section id="mapwrap" aria-label="Map of the Western Front">
      <div class="edge edge-n">&#9650; North: English Channel (impassable)</div>
      <div id="mapframe">
        <div class="side-label side-w">ALLIED REAR</div>
        <div id="grid" role="grid" aria-label="16 by 12 sector grid"></div>
        <div class="side-label side-e">GERMAN REAR</div>
      </div>
      <div class="edge edge-s">&#9660; South: Swiss border (impassable)</div>
    </section>

    <aside id="side">
      <div id="actions" role="toolbar" aria-label="Actions">
        <button data-action="move" class="act">Move</button>
        <button data-action="attack" class="act">Attack</button>
        <button data-action="dig" class="act">Dig</button>
        <button data-action="bombard" class="act">Bombard</button>
        <button data-action="long" class="act">Long Barrage</button>
        <button data-action="gas" class="act">Gas</button>
        <button data-action="hold" class="act">Hold</button>
        <button data-action="endturn" class="act primary">End Turn</button>
      </div>
      <div id="recruit"></div>
      <label class="toggle"><input type="checkbox" id="show-zones"> Always show machine-gun kill zones</label>
      <div id="info" aria-live="polite"></div>
      <div id="legend">
        <b>Key</b>
        <span><i class="lg lg-allied"></i> Allied (blue circle)</span>
        <span><i class="lg lg-german"></i> German (gray square, hatched)</span>
        <span><i class="lg lg-kill"></i> Kill zone</span>
        <span><i class="lg lg-reach"></i> Can move here</span>
      </div>
      <h2>Message log</h2>
      <ol id="log" aria-live="polite"></ol>
      <button id="newgame" class="link">New game</button>
    </aside>
  </main>

  <div id="overlay" hidden>
    <div class="card" role="dialog" aria-modal="true" aria-labelledby="ov-title">
      <h2 id="ov-title"></h2>
      <div id="ov-body"></div>
      <button id="ov-btn" class="act primary"></button>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/map.js"></script>
  <script src="js/units.js"></script>
  <script src="js/years.js"></script>
  <script src="js/combat.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
